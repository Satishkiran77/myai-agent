name: Backend tests

on:
  pull_request:
    branches:
      - feature/benz-quality-baseline
  push:
    branches:
      - feature/benz-quality-baseline
      - feature/benz-privacy-hardening

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run backend tests
        run: npm test
