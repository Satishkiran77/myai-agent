<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Agent</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f5fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 820px;
            height: 88vh;
            min-height: 520px;
            background: white;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 35px #00000015;
        }

        header {
            padding: 20px 22px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        header h2 { margin: 0 0 8px; }
        header p { margin: 0; color: gray; font-size: 14px; }

        button {
            border: none;
            border-radius: 10px;
            background: #315be8;
            color: white;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .secondary { background: #eef1f8; color: #26324b; }
        .delete-button { background: #fff0f0; color: #c62828; }

        #memoryPanel {
            display: none;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            background: #fafbff;
            max-height: 240px;
            overflow-y: auto;
        }

        #memoryPanel.open { display: block; }
        .memory-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .memory-heading h3 { margin: 0 0 12px; font-size: 16px; }
        #memoryList { display: grid; gap: 9px; }

        .memory-category { margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #e2e7f1; color: #315be8; font-size: 14px; font-weight: 700; }

        .memory-item {
            display: grid;
            grid-template-columns: minmax(110px, 0.8fr) minmax(130px, 1.5fr) auto auto;
            gap: 8px;
            align-items: center;
        }

        .memory-item input {
            width: 100%;
            min-width: 0;
            padding: 10px;
            border: 1px solid #dce1ed;
            border-radius: 8px;
            font-size: 13px;
        }

        .memory-item button { padding: 10px 12px; }
        #memoryStatus { color: #596579; font-size: 13px; margin: 10px 0 0; }
        .empty-memory { color: #687386; font-size: 14px; margin: 4px 0; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 13px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .bot { background: #eef1f8; align-self: flex-start; }
        .user { background: #315be8; color: white; align-self: flex-end; }

        .sources-panel {
            width: min(90%, 680px);
            align-self: flex-start;
            display: grid;
            gap: 10px;
            margin-top: -4px;
        }

        .sources-heading {
            margin: 0;
            color: #596579;
            font-size: 13px;
            font-weight: 700;
        }

        .source-card {
            padding: 12px 14px;
            border: 1px solid #e1e6f0;
            border-radius: 12px;
            background: #fff;
            display: grid;
            gap: 6px;
        }

        .source-card a {
            color: #244fc7;
            font-weight: 700;
            text-decoration: none;
            line-height: 1.4;
        }

        .source-card a:hover { text-decoration: underline; }
        .source-meta { color: #687386; font-size: 12px; }
        .source-description { color: #354052; font-size: 13px; line-height: 1.45; }

        @media (max-width: 600px) {
            .sources-panel { width: 100%; }
        }

        #chatForm {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #eee;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .app { height: 94vh; }
            header { align-items: flex-start; flex-direction: column; }
            .memory-item { grid-template-columns: 1fr 1fr; }
            .memory-item button { width: 100%; }
            #chatForm { padding: 12px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div>
                <h2>My Personal AI Agent</h2>
                <p>Powered by Llama 3.2 | Permanent Memory Enabled</p>
            </div>
            <button id="memoryToggle" type="button" class="secondary">My Memories</button>
        </header>

        <section id="memoryPanel">
            <div class="memory-heading">
                <h3>Saved Personal Memories</h3>
                <button id="refreshMemory" type="button" class="secondary">Refresh</button>
            </div>
            <div id="memoryList"></div>
            <p id="memoryStatus" aria-live="polite"></p>
        </section>

        <section id="messages"></section>

        <form id="chatForm">
            <input id="messageInput" placeholder="Ask something..." required>
            <button id="sendButton" type="submit">Send</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const button = document.getElementById("sendButton");
        const memoryToggle = document.getElementById("memoryToggle");
        const memoryPanel = document.getElementById("memoryPanel");
        const memoryList = document.getElementById("memoryList");
        const memoryStatus = document.getElementById("memoryStatus");
        const conversationId = sessionStorage.getItem("conversationId") || crypto.randomUUID();

        sessionStorage.setItem("conversationId", conversationId);

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addSources(sources) {
            if (!Array.isArray(sources) || sources.length === 0) return;

            const panel = document.createElement("section");
            panel.className = "sources-panel";

            const heading = document.createElement("p");
            heading.className = "sources-heading";
            heading.textContent = "Sources";
            panel.appendChild(heading);

            sources.forEach((source) => {
                if (!source || typeof source.url !== "string") return;

                let parsedUrl;
                try {
                    parsedUrl = new URL(source.url);
                    if (!["http:", "https:"].includes(parsedUrl.protocol)) return;
                } catch {
                    return;
                }

                const card = document.createElement("article");
                card.className = "source-card";

                const link = document.createElement("a");
                link.href = parsedUrl.href;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = source.title || parsedUrl.hostname;

                const meta = document.createElement("div");
                meta.className = "source-meta";
                const date = source.publishedAt ? "Published: " + source.publishedAt + " · " : "";
                meta.textContent = date + parsedUrl.hostname;

                card.append(link, meta);

                if (source.snippet) {
                    const description = document.createElement("div");
                    description.className = "source-description";
                    description.textContent = source.snippet;
                    card.appendChild(description);
                }

                panel.appendChild(card);
            });

            if (panel.querySelector(".source-card")) {
                messages.appendChild(panel);
                messages.scrollTop = messages.scrollHeight;
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch("/api/history/" + encodeURIComponent(conversationId));
                const data = await response.json();
                messages.innerHTML = "";

                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(item => addMessage(item.content, item.role === "user" ? "user" : "bot"));
                } else {
                    addMessage("Hello! I am your personal AI Agent. How can I help you?", "bot");
                }
            } catch (error) {
                addMessage("Could not load previous chat history.", "bot");
            }
        }

        function getMemoryCategory(key) {
            const name = key.toLowerCase();
            if (/like|interest|hobby|cricket|sport|music|game|coding/.test(name)) return "Interests";
            if (/favorite|favourite|prefer|preference|language|food|color|colour/.test(name)) return "Preferences";
            return "Personal";
        }

        async function loadMemories() {
            memoryStatus.textContent = "Loading memories...";
            memoryList.innerHTML = "";

            try {
                const response = await fetch("/api/memory");
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not load memories");

                const entries = Object.entries(data.memory || {});
                if (entries.length === 0) {
                    memoryList.innerHTML = '<p class="empty-memory">No saved memories yet.</p>';
                }

                const categoryOrder = { Personal: 0, Interests: 1, Preferences: 2 };
                entries.sort((a, b) => categoryOrder[getMemoryCategory(a[0])] - categoryOrder[getMemoryCategory(b[0])]);
                let currentCategory = "";
                entries.forEach(([key, value]) => {
                    const category = getMemoryCategory(key);
                    if (category !== currentCategory) {
                        const heading = document.createElement("h4");
                        heading.className = "memory-category";
                        heading.textContent = category;
                        memoryList.appendChild(heading);
                        currentCategory = category;
                    }
                    const item = document.createElement("div");
                    item.className = "memory-item";

                    const keyInput = document.createElement("input");
                    keyInput.value = key;
                    keyInput.readOnly = true;
                    keyInput.setAttribute("aria-label", "Memory name");

                    const valueInput = document.createElement("input");
                    valueInput.value = String(value);
                    valueInput.maxLength = 200;
                    valueInput.setAttribute("aria-label", "Memory value");

                    const saveButton = document.createElement("button");
                    saveButton.type = "button";
                    saveButton.textContent = "Save";
                    saveButton.addEventListener("click", async () => {
                        saveButton.disabled = true;
                        try {
                            const updateResponse = await fetch("/api/memory/" + encodeURIComponent(key), {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ value: valueInput.value })
                            });
                            const result = await updateResponse.json();
                            if (!updateResponse.ok) throw new Error(result.error || "Update failed");
                            memoryStatus.textContent = "Memory updated.";
                            await loadMemories();
                        } catch (error) {
                            memoryStatus.textContent = error.message;
                            saveButton.disabled = false;
                        }
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-button";
                    deleteButton.addEventListener("click", async () => {
                        if (!confirm('Delete the memory "' + key + '"?')) return;
                        deleteButton.disabled = true;
                        try {
                            const deleteResponse = await fetch("/api/memory/" + encodeURIComponent(key), {
                                method: "DELETE"
                            });
                            const result = await deleteResponse.json();
                            if (!deleteResponse.ok) throw new Error(result.error || "Delete failed");
                            memoryStatus.textContent = "Memory deleted.";
                            await loadMemories();
                        } catch (error) {
                            memoryStatus.textContent = error.message;
                            deleteButton.disabled = false;
                        }
                    });

                    item.append(keyInput, valueInput, saveButton, deleteButton);
                    memoryList.appendChild(item);
                });

                if (entries.length > 0) memoryStatus.textContent = entries.length + " saved memory item(s).";
            } catch (error) {
                memoryStatus.textContent = error.message || "Could not load memories.";
            }
        }

        memoryToggle.addEventListener("click", async () => {
            memoryPanel.classList.toggle("open");
            if (memoryPanel.classList.contains("open")) await loadMemories();
        });

        document.getElementById("refreshMemory").addEventListener("click", loadMemories);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            button.disabled = true;
            const reply = addMessage("Thinking...", "bot");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message, conversationId })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Request failed");
                reply.textContent = data.reply || "No response received.";
                if (data.intent && data.intent.intent === "web_search") addSources(data.sources);

                if (memoryPanel.classList.contains("open")) await loadMemories();
            } catch (error) {
                reply.textContent = error.message || "Connection failed. Check backend and Ollama.";
            }

            button.disabled = false;
            input.focus();
        });

        loadHistory();
    </script>
</body>
</html>
