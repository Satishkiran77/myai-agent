<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header>
            <div>
                <h2>My Personal AI Agent</h2>
                <p>Powered by Llama 3.2 | Permanent Memory Enabled</p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="memoryToggle" type="button" class="secondary">My Memories</button><button id="changeToken" type="button" class="secondary">Change Token</button></div>
        </header>

        <section class="ai-stage" aria-label="BENZ AI core">
            <div class="stage-copy">
                <span class="eyebrow"><span class="status-dot"></span> BENZ INTELLIGENCE SYSTEM</span>
                <h1>Your intelligence.<br><span>Beyond limits.</span></h1>
                <p>A personal AI space powered by Llama 3.2.</p>
            </div>
            <div class="core-scene" aria-hidden="true">
                <div class="core-orbit orbit-one"></div>
                <div class="core-orbit orbit-two"></div>
                <div class="core-orbit orbit-three"></div>
                <div class="core-glow"></div>
                <div class="core-sphere"><div class="core-highlight"></div></div>
                <div class="core-particles"></div>
                <span class="core-label">B<span>·</span>AI</span>
            </div>
            <div class="stage-caption"><span></span> ALWAYS LEARNING <span></span> ALWAYS EVOLVING</div>
        </section>

        <section id="memoryPanel">
            <div class="memory-heading">
                <h3>Saved Personal Memories</h3>
                <button id="refreshMemory" type="button" class="secondary">Refresh</button>
            </div>
            <div id="memoryList"></div>
            <p id="memoryStatus" aria-live="polite"></p>
        </section>

        <section id="messages"></section>

        <form id="chatForm">
            <input id="messageInput" placeholder="Ask something..." required>
            <button id="sendButton" type="submit">Send</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const button = document.getElementById("sendButton");
        const memoryToggle = document.getElementById("memoryToggle");
        const memoryPanel = document.getElementById("memoryPanel");
        const memoryList = document.getElementById("memoryList");
        const memoryStatus = document.getElementById("memoryStatus");
        const conversationId = sessionStorage.getItem("conversationId") || crypto.randomUUID();
        let accessToken = sessionStorage.getItem("benzAccessToken") || "";
        if (!accessToken) {
            accessToken = prompt("Enter your BENZ access token (set BENZ_ACCESS_TOKEN in the backend terminal):") || "";
            if (accessToken) sessionStorage.setItem("benzAccessToken", accessToken);
        }
        const apiHeaders = (extra = {}) => ({ ...extra, "X-BENZ-ACCESS-TOKEN": accessToken });

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addSources(sources) {
            if (!Array.isArray(sources) || sources.length === 0) return;

            const panel = document.createElement("section");
            panel.className = "sources-panel";

            const heading = document.createElement("p");
            heading.className = "sources-heading";
            heading.textContent = "Sources";
            panel.appendChild(heading);

            sources.forEach((source) => {
                if (!source || typeof source.url !== "string") return;

                let parsedUrl;
                try {
                    parsedUrl = new URL(source.url);
                    if (!["http:", "https:"].includes(parsedUrl.protocol)) return;
                } catch {
                    return;
                }

                const card = document.createElement("article");
                card.className = "source-card";

                const link = document.createElement("a");
                link.href = parsedUrl.href;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = source.title || parsedUrl.hostname;

                const meta = document.createElement("div");
                meta.className = "source-meta";
                const date = source.publishedAt ? "Published: " + source.publishedAt + " · " : "";
                meta.textContent = date + parsedUrl.hostname;

                card.append(link, meta);

                if (source.snippet) {
                    const description = document.createElement("div");
                    description.className = "source-description";
                    description.textContent = source.snippet;
                    card.appendChild(description);
                }

                panel.appendChild(card);
            });

            if (panel.querySelector(".source-card")) {
                messages.appendChild(panel);
                messages.scrollTop = messages.scrollHeight;
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch("/api/history/" + encodeURIComponent(conversationId), { headers: apiHeaders() });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not load chat history");
                messages.innerHTML = "";

                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(item => addMessage(item.content, item.role === "user" ? "user" : "bot"));
                } else {
                    addMessage("Hello! I am your personal AI Agent. How can I help you?", "bot");
                }
            } catch (error) {
                addMessage("Could not load previous chat history.", "bot");
            }
        }

        function getMemoryCategory(key) {
            const name = key.toLowerCase();
            if (/like|interest|hobby|cricket|sport|music|game|coding/.test(name)) return "Interests";
            if (/favorite|favourite|prefer|preference|language|food|color|colour/.test(name)) return "Preferences";
            return "Personal";
        }

        async function loadMemories() {
            memoryStatus.textContent = "Loading memories...";
            memoryList.innerHTML = "";

            try {
                const response = await fetch("/api/memory", { headers: apiHeaders() });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not load memories");

                const entries = Object.entries(data.memory || {});
                if (entries.length === 0) {
                    memoryList.innerHTML = '<p class="empty-memory">No saved memories yet.</p>';
                }

                const categoryOrder = { Personal: 0, Interests: 1, Preferences: 2 };
                entries.sort((a, b) => categoryOrder[getMemoryCategory(a[0])] - categoryOrder[getMemoryCategory(b[0])]);
                let currentCategory = "";
                entries.forEach(([key, value]) => {
                    const category = getMemoryCategory(key);
                    if (category !== currentCategory) {
                        const heading = document.createElement("h4");
                        heading.className = "memory-category";
                        heading.textContent = category;
                        memoryList.appendChild(heading);
                        currentCategory = category;
                    }
                    const item = document.createElement("div");
                    item.className = "memory-item";

                    const keyInput = document.createElement("input");
                    keyInput.value = key;
                    keyInput.readOnly = true;
                    keyInput.setAttribute("aria-label", "Memory name");

                    const valueInput = document.createElement("input");
                    valueInput.value = String(value);
                    valueInput.maxLength = 200;
                    valueInput.setAttribute("aria-label", "Memory value");

                    const saveButton = document.createElement("button");
                    saveButton.type = "button";
                    saveButton.textContent = "Save";
                    saveButton.addEventListener("click", async () => {
                        saveButton.disabled = true;
                        try {
                            const updateResponse = await fetch("/api/memory/" + encodeURIComponent(key), {
                                method: "PUT",
                                headers: apiHeaders({ "Content-Type": "application/json" }),
                                body: JSON.stringify({ value: valueInput.value })
                            });
                            const result = await updateResponse.json();
                            if (!updateResponse.ok) throw new Error(result.error || "Update failed");
                            memoryStatus.textContent = "Memory updated.";
                            await loadMemories();
                        } catch (error) {
                            memoryStatus.textContent = error.message;
                            saveButton.disabled = false;
                        }
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-button";
                    deleteButton.addEventListener("click", async () => {
                        if (!confirm('Delete the memory "' + key + '"?')) return;
                        deleteButton.disabled = true;
                        try {
                            const deleteResponse = await fetch("/api/memory/" + encodeURIComponent(key), {
                                method: "DELETE",
                                headers: apiHeaders()
                            });
                            const result = await deleteResponse.json();
                            if (!deleteResponse.ok) throw new Error(result.error || "Delete failed");
                            memoryStatus.textContent = "Memory deleted.";
                            await loadMemories();
                        } catch (error) {
                            memoryStatus.textContent = error.message;
                            deleteButton.disabled = false;
                        }
                    });

                    item.append(keyInput, valueInput, saveButton, deleteButton);
                    memoryList.appendChild(item);
                });

                if (entries.length > 0) memoryStatus.textContent = entries.length + " saved memory item(s).";
            } catch (error) {
                memoryStatus.textContent = error.message || "Could not load memories.";
            }
        }

        memoryToggle.addEventListener("click", async () => {
            memoryPanel.classList.toggle("open");
            if (memoryPanel.classList.contains("open")) await loadMemories();
        });

        document.getElementById("refreshMemory").addEventListener("click", loadMemories);

        document.getElementById("changeToken").addEventListener("click", async () => {
            const nextToken = prompt("Enter your BENZ access token:");
            if (!nextToken) return;
            accessToken = nextToken;
            sessionStorage.setItem("benzAccessToken", accessToken);
            await loadHistory();
            if (memoryPanel.classList.contains("open")) await loadMemories();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            button.disabled = true;
            const reply = addMessage("Thinking...", "bot");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: apiHeaders({ "Content-Type": "application/json" }),
                    body: JSON.stringify({ message, conversationId })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Request failed");
                reply.textContent = data.reply || "No response received.";
                if (data.intent && data.intent.intent === "web_search") addSources(data.sources);

                if (memoryPanel.classList.contains("open")) await loadMemories();
            } catch (error) {
                reply.textContent = error.message || "Connection failed. Check backend and Ollama.";
            }

            button.disabled = false;
            input.focus();
        });

        loadHistory();
    </script>
</body>
</html>
